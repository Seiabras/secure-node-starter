<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração · Secure Node Starter</title>
<meta name="description" content="Visitas e cadastros por link de origem.">
<link rel="canonical" href="__SITE_URL__/admin">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/app.js" defer></script>
<script src="/js/admin.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/img/icon.svg" alt="" width="28" height="28"><span>Secure Node Starter</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="/sign-in">Entrar</a>
      <a href="/account">Conta</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Alternar entre o modo claro e o escuro"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9 9 0 0 0 12 3z"/></svg></button>
  </div>
</header>
<main id="main" class="wrap">
  <h1>De onde vieram as pessoas</h1>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <div id="admin" hidden>
    <div class="card">
      <p class="muted">Totais por dia de cada link <code>?origin=</code>, nos últimos 30 dias. Nada aqui aponta para uma pessoa.</p>
      <table>
        <thead><tr><th scope="col">Origem</th><th scope="col">Visitas</th><th scope="col">Cadastros</th><th scope="col">Hoje</th></tr></thead>
        <tbody id="origins-body"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Criar um link</h2>
      <form id="link-form" method="post">
        <label for="link-name">Nome do lugar onde o link vai ficar (um post, uma newsletter, um parceiro)</label>
        <input id="link-name" name="name" type="text" maxlength="40" required>
        <button class="button" type="submit">Criar o link</button>
      </form>
      <p id="link-out" class="message" role="status" aria-live="polite"></p>
    </div>
  </div>
</main>
<footer class="foot">
  <div class="wrap"><a href="/privacy">Privacidade</a> · Feito com <a href="https://github.com/Seiabras/secure-node-starter">secure-node-starter</a></div>
</footer>
</body>
</html>
