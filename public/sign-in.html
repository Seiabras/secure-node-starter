<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Secure Node Starter</title>
<meta name="description" content="Sign in with a one-time code sent by e-mail.">
<link rel="canonical" href="__SITE_URL__/sign-in">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/app.js" defer></script>
<script src="/js/sign-in.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/img/icon.svg" alt="" width="28" height="28"><span>Secure Node Starter</span></a>
    <nav class="nav" aria-label="Main">
      <a href="/sign-in" aria-current="page">Sign in</a>
      <a href="/account">Account</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9 9 0 0 0 12 3z"/></svg></button>
  </div>
</header>
<main id="main" class="wrap">
  <h1>Sign in</h1>
  <p class="lead">No password: we e-mail you a 6-digit code. The first sign-in creates the account.</p>
  <div class="card">
    <form id="email-form" method="post" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
      <button class="button" type="submit">Send me a code</button>
    </form>
    <form id="code-form" method="post" hidden novalidate>
      <p>We sent a code to <b id="sent-to"></b>.</p>
      <label for="code">6-digit code</label>
      <input id="code" class="code-input" name="code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" required>
      <div class="actions">
        <button class="button" type="submit">Sign in</button>
        <button class="button quiet" type="button" id="other-email">Use another e-mail</button>
      </div>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </div>
</main>
<footer class="foot">
  <div class="wrap"><a href="/privacy">Privacy</a> · Made with <a href="https://github.com/Seiabras/secure-node-starter">secure-node-starter</a></div>
</footer>
</body>
</html>
